    <title>The Human Maintenance — Live Core & Moon Matrix</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #060810;
            --card: #0d1428;
            --border: #1a2a3a;
            --text: #e8edf5;
            --muted: #6a8a9a;
            --accent: #10b981;
            --glow: rgba(16, 185, 129, 0.2);
            --radius: 18px;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            -webkit-font-smoothing: antialiased;
        }

        body.female {
            --accent: #f472b6;
            --glow: rgba(244, 114, 182, 0.2);
            --border: #3a1a3a;
            --muted: #9a7a8a;
        }

        .app {
            max-width: 720px;
            width: 100%;
            background: var(--card);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            padding: 28px 24px 20px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8);
            position: relative;
            overflow: hidden;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .logo h1 {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #5dbf8a, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo span {
            display: block;
            font-size: 0.6rem;
            font-weight: 400;
            color: var(--muted);
            letter-spacing: 2px;
            text-transform: uppercase;
            -webkit-text-fill-color: var(--muted);
        }

        .lang-selector {
            display: flex;
            gap: 3px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 30px;
            padding: 3px;
            border: 1px solid var(--border);
        }

        .lang-selector button {
            background: transparent;
            border: none;
            color: var(--muted);
            padding: 4px 10px;
            border-radius: 30px;
            font-size: 0.65rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.25s;
            text-transform: uppercase;
        }

        .lang-selector button.active {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 0 20px var(--glow);
        }

        .live-status-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .status-pill {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px 8px;
            text-align: center;
            font-size: 0.7rem;
            color: var(--muted);
        }

        .status-pill span {
            display: block;
            color: var(--accent);
            font-weight: 700;
            font-size: 0.85rem;
            margin-top: 2px;
            letter-spacing: 0.5px;
        }

        .moon-display {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .moon-icon {
            font-size: 1.1rem;
        }

        .form-section {
            margin-bottom: 6px;
        }

        .form-section.hidden {
            display: none;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--muted);
            margin-bottom: 5px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 13px 16px;
            background: #080c1a;
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-size: 1rem;
            transition: 0.3s;
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--glow);
        }

        .form-group input::placeholder {
            color: var(--muted);
            opacity: 0.4;
        }

        .date-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1.4fr;
            gap: 10px;
        }

        .date-row select {
            padding: 13px 10px;
            background: #080c1a;
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
            appearance: none;
            -webkit-appearance: none;
            cursor: pointer;
        }

        .date-row select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--glow);
        }

        .gender-toggle {
            display: flex;
            gap: 10px;
            background: #080c1a;
            border-radius: 12px;
            padding: 4px;
            border: 1px solid var(--border);
        }

        .gender-toggle button {
            flex: 1;
            padding: 10px 0;
            border: none;
            background: transparent;
            color: var(--muted);
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.25s;
        }

        .gender-toggle button.active {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 0 20px var(--glow);
        }

        .btn-primary {
            width: 100%;
            padding: 16px;
            background: var(--accent);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            margin-top: 6px;
            box-shadow: 0 0 30px var(--glow);
        }

        .btn-primary:hover {
            transform: scale(1.01);
            box-shadow: 0 0 50px var(--glow);
        }

        .results-container {
            display: none;
            margin-top: 10px;
        }

        .results-container.active {
            display: block;
            animation: fadeIn 0.6s ease;
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .result-block {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 20px 18px;
            margin-bottom: 14px;
            transition: border-color 0.3s;
            border-left: 3px solid var(--accent);
        }

        .result-block .title {
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .result-block .title .tag {
            font-size: 0.5rem;
            color: var(--muted);
            background: rgba(255, 255, 255, 0.04);
            padding: 2px 10px;
            border-radius: 30px;
            border: 1px solid var(--border);
            font-weight: 400;
        }

        .result-block p {
            font-size: 0.92rem;
            line-height: 1.7;
            color: #d0d8e8;
            margin-top: 2px;
        }

        .result-block .highlight {
            color: var(--accent);
            font-weight: 600;
        }

        .btn-restart {
            display: block;
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--muted);
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.3s;
            text-align: center;
            margin-top: 8px;
        }

        .btn-restart:hover {
            border-color: var(--accent);
            color: #fff;
        }

        .footer {
            margin-top: 28px;
            padding-top: 14px;
            border-top: 1px solid var(--border);
            text-align: center;
            font-size: 0.6rem;
            color: var(--muted);
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .footer strong {
            color: var(--accent);
            font-weight: 600;
        }

        @media (max-width: 480px) {
            .app {
                padding: 16px 12px 14px;
            }

            .logo h1 {
                font-size: 1.2rem;
            }

            .result-block {
                padding: 14px 12px;
            }

            .result-block p {
                font-size: 0.85rem;
            }

            .date-row {
                grid-template-columns: 1fr 1fr 1.2fr;
                gap: 6px;
            }

            .date-row select {
                padding: 11px 6px;
                font-size: 0.9rem;
            }

            .header {
                flex-direction: column;
                align-items: stretch;
            }

            .lang-selector {
                align-self: flex-start;
            }

            .live-status-bar {
                grid-template-columns: 1fr 1fr;
                gap: 6px;
            }

            .live-status-bar .status-pill:last-child {
                grid-column: span 2;
            }
        }
    </style>

            // ================================================================
            // 2. NUMEROLOGICKÉ FUNKCIE (15+ výpočtov)
            // ================================================================

            function numerologySum(str) {
                let sum = 0;
                for (let ch of str) {
                    let d = parseInt(ch);
                    if (!isNaN(d)) sum += d;
                }
                while (sum > 9 && sum !== 11 && sum !== 22 && sum !== 33) {
                    sum = String(sum).split('').reduce((a, b) => parseInt(a) + parseInt(b), 0);
                }
                return sum;
            }

            function nameToNumber(name) {
                const map = {
                    'a': 1, 'á': 1, 'ä': 1, 'b': 2, 'c': 3, 'č': 3, 'd': 4, 'ď': 4,
                    'e': 5, 'é': 5, 'ě': 5, 'f': 6, 'g': 7, 'h': 8, 'ch': 8, 'i': 9,
                    'í': 9, 'j': 1, 'k': 2, 'l': 3, 'm': 4, 'n': 5, 'ň': 5, 'o': 6,
                    'ó': 6, 'ô': 6, 'p': 7, 'q': 8, 'r': 9, 'ř': 9, 's': 1, 'š': 1,
                    't': 2, 'ť': 2, 'u': 3, 'ú': 3, 'ů': 3, 'v': 4, 'w': 5, 'x': 6,
                    'y': 7, 'ý': 7, 'z': 8, 'ž': 8
                };
                let clean = name.toLowerCase().replace(/[^a-záäčďéěíňóôřšťúůýž]/g, '');
                let sum = 0;
                for (let ch of clean) {
                    if (map[ch]) sum += map[ch];
                }
                while (sum > 9 && sum !== 11 && sum !== 22 && sum !== 33) {
                    sum = String(sum).split('').reduce((a, b) => parseInt(a) + parseInt(b), 0);
                }
                return sum;
            }

            function getVowelsSum(name) {
                const vowels = 'aeiouyáäéíóôúý';
                let sum = 0;
                let clean = name.toLowerCase().replace(/[^a-záäčďéěíňóôřšťúůýž]/g, '');
                for (let ch of clean) {
                    if (vowels.includes(ch)) {
                        const map = {
                            'a': 1, 'á': 1, 'ä': 1, 'e': 5, 'é': 5, 'ě': 5,
                            'i': 9, 'í': 9, 'o': 6, 'ó': 6, 'ô': 6, 'u': 3,
                            'ú': 3, 'ů': 3, 'y': 7, 'ý': 7
                        };
                        sum += map[ch] || 0;
                    }
                }
                while (sum > 9 && sum !== 11 && sum !== 22 && sum !== 33) {
                    sum = String(sum).split('').reduce((a, b) => parseInt(a) + parseInt(b), 0);
                }
                return sum;
            }

            function getConsonantsSum(name) {
                const vowels = 'aeiouyáäéíóôúý';
                let sum = 0;
                let clean = name.toLowerCase().replace(/[^a-záäčďéěíňóôřšťúůýž]/g, '');
                for (let ch of clean) {
                    if (!vowels.includes(ch)) {
                        const map = {
                            'b': 2, 'c': 3, 'č': 3, 'd': 4, 'ď': 4, 'f': 6,
                            'g': 7, 'h': 8, 'ch': 8, 'j': 1, 'k': 2, 'l': 3,
                            'm': 4, 'n': 5, 'ň': 5, 'p': 7, 'q': 8, 'r': 9,
                            'ř': 9, 's': 1, 'š': 1, 't': 2, 'ť': 2, 'v': 4,
                            'w': 5, 'x': 6, 'z': 8, 'ž': 8
                        };
                        sum += map[ch] || 0;
                    }
                }
                while (sum > 9 && sum !== 11 && sum !== 22 && sum !== 33) {
                    sum = String(sum).split('').reduce((a, b) => parseInt(a) + parseInt(b), 0);
                }
                return sum;
            }

            function getAdjustedDate(year, month, day, daysOffset) {
                const d = new Date(year, month - 1, day);
                d.setDate(d.getDate() + daysOffset);
                const y = d.getFullYear();
                const m = String(d.getMonth() + 1).padStart(2, '0');
                const dd = String(d.getDate()).padStart(2, '0');
                return `${y}${m}${dd}`;
            }

            function getBirthdayNumber(day) {
                return numerologySum(String(day));
            }

            function getChallenge(day, month) {
                const diff = Math.abs(parseInt(day) - parseInt(month));
                return numerologySum(String(diff));
            }

            function getMaturity(lifePath, destiny) {
                return numerologySum(String(lifePath + destiny));
            }

            function getPersonalYear(day, month, year) {
                const currentYear = new Date().getFullYear();
                const sum = numerologySum(String(day) + String(month) + String(currentYear));

                },

                bindEvents() {
                    this.dom.langButtons.forEach(btn => {
                        btn.addEventListener('click', () => {
                            this.updateLanguage(btn.dataset.lang);
                        });
                    });

                    this.dom.genderButtons.forEach(btn => {
                        btn.addEventListener('click', () => {
                            this.dom.genderButtons.forEach(b => b.classList.remove('active'));
                            btn.classList.add('active');
                            this.gender = btn.dataset.gender;
                            document.body.className = (this.gender === 'f' ? 'female ' : '') + 'hm-grid-bg';
                        });
                    });

                    this.dom.btnStart.addEventListener('click', () => this.startAnalysis());
                    this.dom.btnRestart.addEventListener('click', () => this.restart());
                    this.dom.fullName.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter') this.startAnalysis();
                    });
                },

                populateDates() {
                    const daySel = this.dom.birthDay;
                    for (let i = 1; i <= 31; i++) {
                        const opt = document.createElement('option');
                        opt.value = i;
                        opt.textContent = i;
                        daySel.appendChild(opt);
                    }
                    const yearSel = this.dom.birthYear;
                    const curYear = new Date().getFullYear();
                    for (let y = curYear; y >= 1920; y--) {
                        const opt = document.createElement('option');
                        opt.value = y;
                        opt.textContent = y;
                        yearSel.appendChild(opt);
                    }
                },

                updateLanguage(lang) {
                    this.lang = lang;
                    const t = LANG[lang];
                    if (!t) return;

                    this.dom.langButtons.forEach(btn => {
                        btn.classList.toggle('active', btn.dataset.lang === lang);
                    });

                    this.dom.appTitle.textContent = t.title;
                    this.dom.subBrand.textContent = t.brand;
                    document.getElementById('lblName').textContent = t.name;
                    this.dom.fullName.placeholder = t.namePlaceholder;
                    document.getElementById('lblBirth').textContent = t.birth;
                    document.getElementById('lblGender').textContent = t.gender;
                    document.getElementById('lblDateTitle').textContent = t.dateTitle;
                    document.getElementById('lblMoonTitle').textContent = t.moonTitle;
                    document.getElementById('lblSeasonTitle').textContent = t.seasonTitle;
                    this.dom.genderButtons.forEach(btn => {
                        if (btn.dataset.gender === 'm') btn.textContent = t.male;
                        else btn.textContent = t.female;
                    });
                    this.dom.btnStart.textContent = t.start;
                    this.dom.btnRestart.textContent = t.restart;
                },

                updateStatusBar() {
                    const today = new Date();
                    const lang = this.lang;
                    this.dom.liveDate.textContent = today.toLocaleDateString(lang === 'sk' ? 'sk-SK' : lang === 'en' ? 'en-US' : lang === 'de' ? 'de-DE' : 'cs-CZ');
                    const moonData = this.getMoonPhaseData(today);
                    this.dom.moonIcon.textContent = moonData.icon;
                    this.dom.moonPhase.textContent = lang === 'sk' ? moonData.nameSk : moonData.nameEn;
                    this.dom.season.textContent = this.getSeasonName(today);
                },

                getMoonPhaseData(date) {
                    let year = date.getFullYear(),
                        month = date.getMonth() + 1,
                        day = date.getDate();
                    if (month < 3) { year--;
                        month += 12; }
                    ++month;
                    let c = 365.25 * year,
                        e = 30.6 * month,
                        jd = c + e + day - 694039.0;
                    jd /= 29.53058867;
                    let b = parseInt(jd);
                    jd -= b;
                    let phase = Math.round(jd * 8);
                    if (phase >= 8) phase = 0;
                    const phases = [
                        { nameSk: "Nov (Prázdno)", nameEn: "New Moon", icon: "🌑" },
                        { nameSk: "Dorastajúci srp", nameEn: "Waxing Crescent", icon: "🌒" },
                        { nameSk: "Prvá štvrť", nameEn: "First Quarter", icon: "🌓" },
                        { nameSk: "Dorastajúci mesiac", nameEn: "Waxing Gibbous", icon: "🌔" },
                        { nameSk: "Spln (Max tlak)", nameEn: "Full Moon", icon: "🌕" },
                        { nameSk: "Cúvajúci mesiac", nameEn: "Waning Gibbous", icon: "🌖" },
                        { nameSk: "Posledná štvrť", nameEn: "Last Quarter", icon: "🌗" },
                        { nameSk: "Ubúdajúci srp", nameEn: "Waning Crescent", icon: "🌘" }
                    ];
                    return phases[phase];
                },

                getSeasonName(date) {
                    let m = date.getMonth() + 1,
                        d = date.getDate();
                    const lang = this.lang;
                    if (lang === 'sk') {
                        if ((m == 3 && d >= 21) || (m > 3 && m < 6) || (m == 6 && d < 21)) return "Jarná špirála (Vzostup)";
                        if ((m == 6 && d >= 21) || (m > 6 && m < 9) || (m == 9 && d < 23)) return "Letná špirála (Výkon)";
                        if ((m == 9 && d >= 23) || (m > 9 && m < 12) || (m == 12 && d < 21)) return "Jeseň (Vyúčtovanie)";
                        return "Zimná špirála (Korene)";
                    } else if (lang === 'en') {
                        if ((m == 3 && d >= 21) || (m > 3 && m < 6) || (m == 6 && d < 21)) return "Spring Spiral (Ascent)";
                        if ((m == 6 && d >= 21) || (m > 6 && m < 9) || (m == 9 && d < 23)) return "Summer Spiral (Output)";
                        if ((m == 9 && d >= 23) || (m > 9 && m < 12) || (m == 12 && d < 21)) return "Autumn Spiral (Harvest)";
                        return "Winter Spiral (Roots)";
                    } else if (lang === 'de') {
                        if ((m == 3 && d >= 21) || (m > 3 && m < 6) || (m == 6 && d < 21)) return "Frühlingsspirale (Aufstieg)";
                        if ((m == 6 && d >= 21) || (m > 6 && m < 9) || (m == 9 && d < 23)) return "Sommerspirale (Leistung)";
                        if ((m == 9 && d >= 23) || (m > 9 && m < 12) || (m == 12 && d < 21)) return "Herbstspirale (Abrechnung)";
                        return "Winterspirale (Wurzeln)";
                    } else {
                        if ((m == 3 && d >= 21) || (m > 3 && m < 6) || (m == 6 && d < 21)) return "Jarní spirála (Vzestup)";
                        if ((m == 6 && d >= 21) || (m > 6 && m < 9) || (m == 9 && d < 23)) return "Letní spirála (Výkon)";
                        if ((m == 9 && d >= 23) || (m > 9 && m < 12) || (m == 12 && d < 21)) return "Podzim (Vyúčtování)";
                        return "Zimní spirála (Kořeny)";
                    }
                },

                startAnalysis() {
                    const name = this.dom.fullName.value.trim();
                    const day = parseInt(this.dom.birthDay.value);
                    const month = parseInt(this.dom.birthMonth.value);
                    const year = parseInt(this.dom.birthYear.value);

                    if (!name || !day || !month || !year) {
                        alert(LANG[this.lang].alert);
                        return;
                    }

                    const counterKey = (window.location.pathname.match(/\/systems\/([^/]+)\/index\.html$/) || [,'system'])[1] || 'system';
                    const counters = window.__HM_SYSTEM_USAGE__ || (window.__HM_SYSTEM_USAGE__ = {});
                    counters[counterKey] = (counters[counterKey] || 0) + 1;
                    const counterEl = document.getElementById('systemUsageCounter');
                    if (counterEl) counterEl.textContent = 'Počet použití: ' + counters[counterKey] + 'x';

                    const t = LANG[this.lang];
                    const today = new Date();

                    // ===== VÝPOČTY =====
                    const birthStr = `${year}${String(month).padStart(2,'0')}${String(day).padStart(2,'0')}`;
                    const designStr = getAdjustedDate(year, month, day, -88);

                    const lifePath = numerologySum(birthStr);
                    const design = numerologySum(designStr);
                    const destiny = nameToNumber(name);
                    const soulUrge = getVowelsSum(name);
                    const personality = getConsonantsSum(name);
                    const birthday = getBirthdayNumber(day);
                    const challenge = getChallenge(day, month);
                    const maturity = getMaturity(lifePath, destiny);

                    const personalYear = getPersonalYear(day, month, year);
                    const personalMonth = getPersonalMonth(personalYear);
                    const personalDay = getPersonalDay(personalYear, personalMonth);
                    const personalWeek = getPersonalWeek(personalYear, personalMonth);

                    const universalYear = getUniversalYear();
                    const universalDay = getUniversalDay();

                    const lunarDay = getLunarDay(today);
                    const moonData = this.getMoonPhaseData(today);
                    const sign = getZodiacSign(month, day);

                    // ===== GENEROVANIE TEXTU =====
                    const parts = t.parts;
                    const tags = t.tags;
                    const gender = this.gender;

                    const coreText = generateCore(lifePath, design, birthday);
                    const soulText = generateSoul(soulUrge, personality, destiny);
                    const challengeText = generateChallenge(challenge, maturity);
                    const yearText = generateYear(personalYear, universalYear);
                    const monthText = generateMonth(personalMonth);
                    const todayText = generateToday(personalDay, universalDay, lunarDay);
                    const moonText = generateMoon(moonData.nameSk, moonData.icon, lunarDay);
                    const astrologyText = generateAstrology(sign);

                    const allNumbers = { lifePath, design, destiny, soulUrge, personality, personalYear, personalMonth, personalDay, challenge, maturity, universalYear, universalDay, lunarDay, sign };
                    const synthesisText = generateSynthesis(allNumbers, gender);

                    // ===== ZOBRAZENIE =====
                    const html = `
                        <div class="result-block">
                            <div class="title">${parts.core} <span class="tag">${tags.core}</span></div>
                            <p>${coreText}</p>
                        </div>
                        <div class="result-block">
                            <div class="title">${parts.soul} <span class="tag">${tags.soul}</span></div>
                            <p>${soulText}</p>
                        </div>
                        <div class="result-block">
                            <div class="title">${parts.challenge} <span class="tag">${tags.challenge}</span></div>
                            <p>${challengeText}</p>
                        </div>
                        <div class="result-block">
                            <div class="title">${parts.year} <span class="tag">${tags.year}</span></div>
                            <p>${yearText}</p>
                        </div>
                        <div class="result-block">
                            <div class="title">${parts.month} <span class="tag">${tags.month}</span></div>
                            <p>${monthText}</p>
                        </div>
                        <div class="result-block">
                            <div class="title">${parts.today} <span class="tag">${tags.today}</span></div>
                            <p>${todayText}</p>
                        </div>
                        <div class="result-block">
                            <div class="title">${parts.moon} <span class="tag">${tags.moon}</span></div>
                            <p>${moonText}</p>
                        </div>
                        <div class="result-block">
                            <div class="title">${parts.astrology} <span class="tag">${tags.astrology}</span></div>
                            <p>${astrologyText}</p>
                        </div>
                        <div class="result-block">
                            <div class="title">${parts.synthesis} <span class="tag">${tags.synthesis}</span></div>
                            <p style="white-space:pre-line;">${synthesisText}</p>
                        </div>
                    `;

                    this.dom.outputWrapper.innerHTML = html;
                    this.dom.formSection.style.display = 'none';
                    this.dom.resultsContainer.classList.add('active');
                    this.dom.resultsContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
                },

                restart() {
                    this.dom.resultsContainer.classList.remove('active');
                    this.dom.formSection.style.display = 'block';
                    this.dom.outputWrapper.innerHTML = '';
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            };

            document.addEventListener('DOMContentLoaded', () => app.init());
            window.app = app;
        })();
    </script>
    <script src="../../js/common-systems.js"></script>
</body>
</html>
